############################################
# APPLICATION
############################################
server.port=8081
spring.application.name=rfp-service
spring.config.import=optional:file:.env[.properties]
############################################
# LLM OLLAMA (ACTIVE)
############################################
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3.5:9b
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.chat.options.num-predict=2048
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.num-ctx=16384
app.llm.judge-model=qwen3.5:9b
spring.autoconfigure.exclude[0]=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
spring.autoconfigure.exclude[3]=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
spring.autoconfigure.exclude[4]=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
spring.autoconfigure.exclude[5]=org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
############################################
# LLM OPENROUTER (uncomment to use, comment Ollama block and its excludes above)
############################################
