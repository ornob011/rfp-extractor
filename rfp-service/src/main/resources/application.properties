############################################
# APPLICATION
############################################

server.port=8080
spring.application.name=rfp-service
spring.config.import=optional:file:.env[.properties]

############################################
# LLM OLLAMA (ACTIVE)
############################################

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3.5:9b
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.chat.options.num-predict=4096
spring.ai.ollama.chat.options.format=json
app.llm.judge-model=qwen3.5:27b

############################################
# LLM OPENROUTER (uncomment to use, comment Ollama block above)
############################################

