# Server
server.port=8080
spring.application.name=rfp-service
# LLM Provider
app.llm.provider=openrouter
app.llm.openrouter.base-url=https://openrouter.ai/api/v1
app.llm.openrouter.api-key=${OPENROUTER_API_KEY:}
app.llm.openrouter.model=google/gemini-2.0-flash-001
app.llm.openrouter.model-judge=google/gemini-2.5-pro-preview-06-05
app.llm.ollama.base-url=http://localhost:11434
app.llm.ollama.model=llama3.1:8b
app.llm.ollama.model-judge=llama3.1:70b
app.llm.temperature=0.0
app.llm.max-tokens=4096
app.llm.chunk-size-tokens=3500
app.llm.timeout-seconds=30
app.llm.rate-limit-per-minute=60
# Async
app.async.core-pool-size=2
app.async.max-pool-size=4
app.async.queue-capacity=20
# Upload
app.upload.max-size-mb=100
# Storage
app.storage.base-path=/tmp/rfp-storage
# OCR Sidecar
app.ocr.sidecar-url=http://localhost:8000
# Database (local defaults)
spring.datasource.url=jdbc:postgresql://localhost:5432/rfpdb
spring.datasource.username=${POSTGRES_USER:rfpuser}
spring.datasource.password=${POSTGRES_PASSWORD:rfppass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Resilience4j — llm instance (dynamic values fine-tuned via LlmResilienceCustomizers)
resilience4j.retry.instances.llm.max-attempts=3
resilience4j.retry.instances.llm.ignore-exceptions[0]=com.dsi.rfp.domain.exception.LlmResponseParseException
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.llm.sliding-window-size=10
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llm.permitted-number-of-calls-in-half-open-state=3
resilience4j.ratelimiter.instances.llm.limit-for-period=60
resilience4j.ratelimiter.instances.llm.limit-refresh-period=1m
resilience4j.timelimiter.instances.llm.timeout-duration=30s
resilience4j.timelimiter.instances.llm.cancel-running-future=true
spring.ai.openai.api-key=${OPENROUTER_API_KEY:NOOP}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.ollama.base-url=http://localhost:11434
# Schema
app.schema.rfp-schema-path=schema/rfp-schema-v1.json
# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
