############################################
# ASYNC
############################################

app.async.core-pool-size=2
app.async.max-pool-size=4
app.async.queue-capacity=20

############################################
# UPLOAD & STORAGE
############################################

app.upload.max-size-mb=100
app.storage.base-path=/tmp/rfp-storage
app.storage.encryption.keyset=${STORAGE_ENCRYPTION_KEYSET:}

############################################
# OCR SIDECAR
############################################

app.sidecar.url=http://localhost:8000
app.sidecar.connect-timeout-seconds=5
app.sidecar.read-timeout-seconds=60

############################################
# SECURITY / JWT
############################################

app.security.jwt.private-key-path=classpath:jwt-private.pem
app.security.jwt.public-key-path=classpath:jwt-public.pem
app.security.jwt.expiry-hours=8
app.security.auth.refresh-window-hours=1
app.security.cors.allowed-origins[0]=http://localhost:5173

############################################
# PROMPT INJECTION FILTER
############################################

app.security.prompt-injection.phrases[0]=ignore all previous instructions
app.security.prompt-injection.phrases[1]=ignore previous instructions
app.security.prompt-injection.phrases[2]=disregard all prior instructions
app.security.prompt-injection.phrases[3]=disregard prior instructions
app.security.prompt-injection.phrases[4]=disregard all prior context
app.security.prompt-injection.phrases[5]=disregard prior context
app.security.prompt-injection.phrases[6]=you are now a
app.security.prompt-injection.phrases[7]=forget everything you
app.security.prompt-injection.phrases[8]=forget all you
app.security.prompt-injection.phrases[9]=forget everything above
app.security.prompt-injection.phrases[10]=forget all above
app.security.prompt-injection.phrases[11]=new instructions:
app.security.prompt-injection.phrases[12]=new instruction:
app.security.prompt-injection.phrases[13]=override the system
app.security.prompt-injection.phrases[14]=override the instructions
app.security.prompt-injection.phrases[15]=override system
app.security.prompt-injection.phrases[16]=override instructions
app.security.prompt-injection.phrases[17]=do not follow the previous
app.security.prompt-injection.phrases[18]=do not follow previous
app.security.prompt-injection.phrases[19]=system: you are
app.security.prompt-injection.phrases[20]=system:you are
app.security.prompt-injection.phrases[21]=[system]
app.security.prompt-injection.phrases[22]=<system>
app.security.prompt-injection.phrases[23]=jailbreak
app.security.prompt-injection.phrases[24]=prompt injection
app.security.prompt-injection.delimiter-open=<document_content>
app.security.prompt-injection.delimiter-close=</document_content>
app.security.prompt-injection.filtered-marker=[FILTERED]

############################################
# BANGLA ENCODING VALIDATION
############################################

app.validation.bangla.sample-pages=3
app.validation.bangla.confidence-threshold=0.8
app.validation.bangla.min-bangla-chars=10
app.validation.bangla.legacy-ratio-threshold=0.30
app.validation.bangla.high-confidence-ratio=0.60
app.validation.bangla.min-pattern-hits=1
app.validation.bangla.high-confidence-pattern-hits=3
app.validation.bangla.medium-confidence=0.60
app.validation.bangla.high-confidence=0.85
app.validation.bangla.clean-reason=No legacy encoding detected
app.validation.bangla.legacy-reason-template=Detected %d Bangla Unicode characters with mix ratio %.2f and %d suspicious legacy patterns; possible SutonnyMJ/Bijoy legacy encoding
app.validation.bangla.suspicious-patterns[0]=cÖ
app.validation.bangla.suspicious-patterns[1]=wK
app.validation.bangla.suspicious-patterns[2]=‡h
app.validation.bangla.suspicious-patterns[3]=Kvh
app.validation.bangla.suspicious-patterns[4]=‡m

############################################
# DATABASE (POSTGRESQL)
############################################

spring.datasource.url=jdbc:postgresql://localhost:5432/rfpdb
spring.datasource.username=${POSTGRES_USER:rfpuser}
spring.datasource.password=${POSTGRES_PASSWORD:rfppass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

############################################
# RESILIENCE4J LLM
############################################

resilience4j.retry.instances.llm.max-attempts=3
resilience4j.retry.instances.llm.wait-duration=1s
resilience4j.retry.instances.llm.enable-exponential-backoff=true
resilience4j.retry.instances.llm.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.llm.enable-randomized-wait=true
resilience4j.retry.instances.llm.randomized-wait-factor=0.3
resilience4j.retry.instances.llm.ignore-exceptions[0]=com.dsi.rfp.domain.exception.LlmResponseParseException
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.llm.sliding-window-size=10
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llm.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llm.record-exceptions[0]=com.dsi.rfp.domain.exception.LlmUnavailableException
resilience4j.circuitbreaker.instances.llm.record-exceptions[1]=java.io.IOException
resilience4j.circuitbreaker.instances.llm.record-exceptions[2]=java.util.concurrent.TimeoutException
resilience4j.ratelimiter.instances.llm.limit-for-period=60
resilience4j.ratelimiter.instances.llm.limit-refresh-period=1m
resilience4j.ratelimiter.instances.llm.timeout-duration=10s
resilience4j.timelimiter.instances.llm.timeout-duration=30s
resilience4j.timelimiter.instances.llm.cancel-running-future=true

############################################
# RESILIENCE4J OCR
############################################

resilience4j.retry.instances.ocr.max-attempts=2
resilience4j.retry.instances.ocr.wait-duration=2s
resilience4j.retry.instances.ocr.retry-exceptions[0]=com.dsi.rfp.domain.exception.OcrUnavailableException
resilience4j.retry.instances.ocr.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.ocr.ignore-exceptions[0]=java.lang.IllegalArgumentException

############################################
# SCHEMA
############################################

app.schema.rfp-schema-path=schema/rfp-schema-v1.json

############################################
# MULTIPART
############################################

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

############################################
# FREEMARKER
############################################

spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8
spring.freemarker.check-template-location=true
spring.freemarker.settings.template_exception_handler=rethrow
spring.freemarker.settings.log_template_exceptions=false
spring.freemarker.settings.wrap_unchecked_exceptions=true
spring.freemarker.settings.fallback_on_null_loop_variable=false
