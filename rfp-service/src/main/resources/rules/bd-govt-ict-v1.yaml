pack_id: bd-govt-ict-v1
pack_version: "1.0.0"
rfp_type: ICT
rules:
  # ── FATAL (8 rules) ──────────────────────────────────────────────────────

  - id: BD-ICT-001
    name: RFP Title Present
    pack: bd-govt-ict-v1
    version: "1.0.0"
    severity: FATAL
    check_type: structural
    condition: "sections[?title] | length(@) > `0`"
    evidence_path: "sections[0].title"
    message: "RFP Title is missing from the document"

  - id: BD-ICT-002
    name: Scope of Work Present
    pack: bd-govt-ict-v1
    version: "1.0.0"
    severity: FATAL
    check_type: structural
    condition: "entities.scopeOfWork != null"
    evidence_path: "entities.scopeOfWork"
    message: "Scope of work is missing from the document"

  - id: BD-ICT-004
    name: Client Name Present
    pack: bd-govt-ict-v1
    version: "1.0.0"
    severity: FATAL
    check_type: structural
    condition: "entities.clientName != null"
    evidence_path: "entities.clientName"
    message: "Client / Procuring Entity name is missing"

  - id: BD-ICT-005
