# ============================================================
# Confidence Scoring Configuration v1
# Single source of truth for all confidence-related thresholds,
# entity field metadata, and scoring parameters.
# ============================================================

# --- Global Thresholds ---
thresholds:
  lowConfidence: 0.6
  manualReview: 0.5
  shortTextLength: 5

# --- Badge Display Thresholds ---
badge:
  high: 0.8
  medium: 0.5

# --- Completeness ---
completeness:
  key: "doc_completeness_score"

