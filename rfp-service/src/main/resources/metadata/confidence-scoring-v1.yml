# --- Section Strategy Confidence (Sprint 7) ---
sectionStrategyConfidence:
  TOC: 1.0
  BOOKMARK: 0.95
  HEADING_STYLE: 0.90
  NUMBERED: 0.85
  BANGLA: 0.85
  FONT_SIZE: 0.70
  ALL_CAPS: 0.55
  LLM: 0.75
  UNKNOWN: 0.60

# --- Table Provenance Confidence (Sprint 7) ---
tableProvenanceConfidence:
  LATTICE: 0.85
  VLM: 0.80
  STREAM: 0.65
  VLM_TABLE_RECONSTRUCT: 0.55
  UNKNOWN: 0.50

# --- Repair Limits (Sprint 7) ---
repair:
  maxTotalIterations: 20
  maxRetriesPerItem: 3
