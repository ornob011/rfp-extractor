version: 1
extractorOrder:
  - vlm
  - lattice
  - stream
methods:
  vlm: vlm
  lattice: lattice
  stream: stream
lattice:
  minLinesForTable: 4
  maxCells: 200
  lineTolerance: 2.0
stream:
  yProximityTolerance: 3.0
  columnGapRatio: 0.03
  confidence: 0.6
  minColumns: 2
  minRows: 2
continuation:
  requiredSignals: 1
  headerDistanceThreshold: 3
  footerKeywords:
    - total
    - sub total
    - subtotal
    - grand total
scanned:
  promptResourcePath: prompts/scanned-table-reconstruction-v1.md
  systemPromptResourcePath: prompts/scanned-table-system-v1.md
  maxPageTextLength: 3000
  confidenceFactor: 0.8
  llmMethod: vlm_table_reconstruct
