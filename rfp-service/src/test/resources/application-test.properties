# Test Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test Infrastructure
app.sidecar.url=http://localhost:8000
app.llm.openrouter.api-key=test-key

# Resilience4j: Test Overrides
resilience4j.retry.instances.llm.max-attempts=1
resilience4j.timelimiter.instances.llm.timeout-duration=5s

# FreeMarker
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8
spring.freemarker.check-template-location=true
spring.freemarker.settings.template_exception_handler=rethrow
spring.freemarker.settings.log_template_exceptions=false
spring.freemarker.settings.wrap_unchecked_exceptions=true
spring.freemarker.settings.fallback_on_null_loop_variable=false
