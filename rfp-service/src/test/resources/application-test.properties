############################################
# DATABASE (H2 IN-MEMORY)
############################################
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
############################################
# VISION SIDECAR
############################################
app.sidecar.url=http://localhost:8000
############################################
# SECURITY / JWT
############################################
app.security.jwt.private-key-path=classpath:jwt-test-private.pem
app.security.jwt.public-key-path=classpath:jwt-test-public.pem
app.security.jwt.expiry-hours=1
app.security.auth.refresh-window-hours=1
app.security.cors.allowed-origins[0]=http://localhost:5173
############################################
# PROMPT INJECTION FILTER
############################################
app.security.prompt-injection.phrases[0]=ignore all previous instructions
app.security.prompt-injection.phrases[1]=system: you are
app.security.prompt-injection.phrases[2]=jailbreak
app.security.prompt-injection.delimiter-open=<document_content>
app.security.prompt-injection.delimiter-close=</document_content>
app.security.prompt-injection.filtered-marker=[FILTERED]
############################################
# BANGLA ENCODING VALIDATION
############################################
app.validation.bangla.sample-pages=3
app.validation.bangla.confidence-threshold=0.8
app.validation.bangla.min-bangla-chars=10
app.validation.bangla.legacy-ratio-threshold=0.30
app.validation.bangla.high-confidence-ratio=0.60
app.validation.bangla.min-pattern-hits=1
app.validation.bangla.high-confidence-pattern-hits=3
app.validation.bangla.medium-confidence=0.60
app.validation.bangla.high-confidence=0.85
app.validation.bangla.clean-reason=No legacy encoding detected
app.validation.bangla.legacy-reason-template=Detected %d Bangla Unicode characters with mix ratio %.2f and %d suspicious legacy patterns; possible SutonnyMJ/Bijoy legacy encoding
app.validation.bangla.suspicious-patterns[0]=cÖ
app.validation.bangla.suspicious-patterns[1]=wK
app.validation.bangla.suspicious-patterns[2]=‡h
############################################
# STORAGE ENCRYPTION
############################################
app.storage.encryption.
############################################
# RESILIENCE4J TEST OVERRIDES
############################################
resilience4j.retry.instances.llm.max-attempts=1
resilience4j.timelimiter.instances.llm.timeout-duration=5s

