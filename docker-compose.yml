services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-rfpdb}
            POSTGRES_USER: ${POSTGRES_USER:-rfpuser}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfppass}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfpuser} -d ${POSTGRES_DB:-rfpdb}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    rfp-python-ocr:
        build:
            context: ./rfp-python-ocr
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        environment:
            PYTHONUNBUFFERED: "1"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s

    rfp-service:
        build:
            context: .
            dockerfile: rfp-service/Dockerfile
        ports:
            - "8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: docker
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
            POSTGRES_USER: ${POSTGRES_USER:-rfpuser}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfppass}
            POSTGRES_DB: ${POSTGRES_DB:-rfpdb}
        depends_on:
            postgres:
                condition: service_healthy
            rfp-python-ocr:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        volumes:
            - rfp_storage:/app/rfp-storage

    rfp-frontend:
        build:
            context: ./rfp-frontend
            dockerfile: Dockerfile
        ports:
            - "3000:80"
        depends_on:
            rfp-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:80"]
            interval: 30s
            timeout: 5s
            retries: 3

volumes:
    postgres_data:
    rfp_storage:
